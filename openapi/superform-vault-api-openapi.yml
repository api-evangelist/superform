          - number
          - 'null'
        apy_now:
          description: APY.
          format: double
          type:
          - number
          - 'null'
        apy_week:
          description: APY calculated over a 7 day time frame and scaled to a year.
          format: double
          type:
          - number
          - 'null'
        apy_week_change:
