        tvl_day_change:
          description: TVL change over the past day, in percent.
          format: double
          type:
          - number
          - 'null'
        tvl_month_change:
          description: TVL change over the past month, in percent.
          format: double
          type:
          - number
          - 'null'
        tvl_now:
          description: Total Value Locked.
          format: double
          type:
          - number
          - 'null'
        tvl_week_change:
