name: Superform
description: >-
  Superform is a user-owned onchain neobank and the operating system for programmable
  DeFi vaults. The protocol enables single-signature execution of arbitrary actions
  across chains and optimized yield vaults, built on ERC-4626 / ERC-7540 tokenized
  vaults and ERC-7579 smart accounts. Its public API (api.superform.xyz) exposes
  vault and protocol data, cross-chain deposit/withdraw/rebalance transaction routing,
  user portfolios and balances, superpositions, and protocol rewards. A separate
  SuperformOS "operate" API (Erebor, Strategy Engine, and OMS) lets vault managers
  create, configure, and automate SuperVaults. Originally added as a Polychain
  portfolio lead, this profile has been enriched from Superform's real developer surface.
